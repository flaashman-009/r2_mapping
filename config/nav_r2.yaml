local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 2026-09-16：车实际 0.3375×0.1911 m，原来的 r=0.1 圆太小，
      # 规划器会贴着障碍物走。改成真实矩形（footprint 优先于 robot_radius）。
      footprint: "[[0.17, 0.10], [0.17, -0.10], [-0.17, -0.10], [-0.17, 0.10]]"
      footprint_padding: 0.02
      robot_radius: 0.1
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.2
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          # 0.23 -> 0.40：R2 的 LiDAR 能扫到车尾左右两个角，
          # 实测近点分布在 0.148-0.35 m。原来 0.23 的近场截断挡不住，
          # 结果在车自己身上标出致命障碍 —— 全局规划器从致命格出发，
          # 规划必然失败（GridBased: failed to create plan），
          # 倒车恢复也会报 "Collision Ahead"。
          obstacle_min_range: 0.40
          clearing: true
          marking: true
          data_type: LaserScan
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.2
        z_voxels: 10
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: pointcloud
        pointcloud:
          topic: /intel_realsense_r200_depth/points
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: PointCloud2
      static_layer:
        map_subscribe_transient_local: true
      always_send_full_costmap: true
