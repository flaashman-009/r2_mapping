amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.3
    alpha4: 0.3
    alpha5: 0.1
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    # 2026-09-16 修：原来写 100.0，而实际雷达量程只有 50 m、有效回波 ~6 m。
    # 值太大等于"什么都当有效"，远处的假回波会拉低正确位姿的权重。
    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    # 2026-09-16 修：雷达 2020 个光束只抽 60 根，似然场太稀。
    # 长走廊+稀疏地图下，抽得太少会让粒子权重区分不开。
    # 2026-09-18 修：180 → 360。从 2020 根光束里抽得越多，
    # 长走廊那种"似然场平坦"的方向约束越强，位姿越不容易滑。
    # 代价是 CPU 略升，Jetson 完全吃得下。
    max_beams: 360
    max_particles: 4000
    min_particles: 1000
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    # 2026-09-18 调低：这两个参数控制 AMCL"随机撒粒子自救"的灵敏度。
    # 匹配质量短期骤降时（w_fast << w_slow），AMCL 会撒随机粒子找位置；
    # 撒多了，某个错误位置碰巧得分高，整个位姿就被拽走 ——
    # 实测 30~40 米的瞬移都是这么来的。
    # 调小 = 更信运动模型、不容易跳走（代价：真跟丢时恢复慢一点）。
    recovery_alpha_fast: 0.05
    recovery_alpha_slow: 0.0005
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.25
    # 2026-09-18 修：这是本次最关键的一条。
    #
    # AMCL 每收到一帧激光，先看"从上次更新到现在车移动了多少"：
    #     小于门槛  →  跳过，不跑粒子滤波
    #     大于等于  →  才更新一次
    #
    # 实测（9-18 记录 t=256~261s）：车慢慢倒车 0.34 米，按原来 0.05 米的
    # 门槛会更新约 7 次；每一次更新都是在"似然场平坦"的长走廊里滑一点的
    # 机会，7 次累加下来位姿滑了 3.9 米 —— 这就是"到点前很准、
    # 减速/停下就不准"的原因。
    #
    # 改成 0.15 米后，同样的 0.34 米只会触发 2 次更新，滑移机会减少约 70%；
    # 车完全静止时（里程计不变）一次都不会更新，所以不需要手动停导航。
    update_min_a: 0.10
    update_min_d: 0.15
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    # 2026-09-16 修：必须和建图用同一份扫描。
    # 地图是 /scan_filtered 建的（屏蔽了车尾 ±120–150° 车体自遮挡），
    # 原来 AMCL 读原始 /scan，带着 144 个车身近点，车一转就污染匹配。
    scan_topic: scan_filtered
    # ================================================================
    # 2026-09-16 新增：启动时自动设初始位姿
    #
    # 为什么必须加：
    #   AMCL 在收到初始位姿之前**不会发布 map->odom**，而没有这条 TF，
    #   `map` 坐标系在 TF 树里就不存在。RViz 的固定坐标系是 map，
    #   固定坐标系不存在时 RViz **整个画面什么都不渲染** ——
    #   于是"一键启动后 RViz 里看不到 room_04 的地图"，
    #   而且连点 2D Pose Estimate 都得盲点。
    #
    #   加上 set_initial_pose 之后，AMCL 一起来就用下面的位姿发布
    #   map->odom，地图立刻可见。建图是从 (0,0,0) 开始的，所以
    #   默认值取原点；车不在原点时再用 RViz 的 2D Pose Estimate 修正。
    # ================================================================
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
