bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: false
controller_server:
  ros__parameters:
    use_sim_time: false
    # 2026-09-15 修正拼写：原来写成了 ontroller_frequency（少一个 c），
    # 这个参数一直没生效（幸好 nav2 默认值也是 20.0，所以没造成影响）。
    # 2026-09-17 修：20 → 10 Hz。控制器每个周期都会重新优化轨迹，
    # 频率减半能直接降低转向指令的抖动频率（"左右打方向"的来源）。
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    # 2026-09-16 修：原来 0.2，而 linear.y 的满量程只有 ±0.05（±45°）。
    # 阈值比满量程还大 = 任何 linear.y 都会被当成 0 抹掉。
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugin: goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 6.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # 2026-09-17 放宽：阿克曼车到不了"原地转"，收尾阶段只能前后挪着凑，
      # 容差太紧会表现为原地反复修方向。
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.35
      stateful: true
    # ==================================================================
    # TEB 局部控制器 —— 2026-09-16 大改
    #
    # 原来这一段只有 22 个参数，而且**缺全部阿克曼约束**，等于把阿克曼车
    # 当差速车在规划：它能算出"原地转"或"转弯半径极小"的轨迹，车根本
    # 执行不了，于是控制器一次次重规划、前轮反复打到满舵。
    # ==================================================================
    FollowPath:
      plugin: teb_local_planner::TebLocalPlannerROS

      # 车辆几何：车长 0.3375 × 宽 0.1911 m（实测）。
      # 原来用 r=0.1 的圆，规划器以为车很小，敢贴着墙规划，
      # 一旦有偏差就得急打方向纠回来。
      footprint_model.type: polygon
      footprint_model.vertices: "[[0.17, 0.10], [0.17, -0.10], [-0.17, -0.10], [-0.17, 0.10]]"

      # ---- 阿克曼约束（原来一条都没有，这是"猛打方向"的根源）----
      wheelbase: 0.2681
      min_turning_radius: 0.28          # L/tan(44°)≈0.277，不许规划更小的弯
      weight_kinematics_turning_radius: 5.0
      weight_kinematics_forward_drive: 10.0   # 惩罚倒车（避障需要时仍可倒）
      weight_kinematics_nh: 1000.0      # 非完整约束：车不能横着走

      # ---- 速度限制 ----
      # max_vel_theta 原来 1.0 rad/s：在 0.23 m/s 下换算出的转向角是
      # atan(1.0×0.268/0.23)=49°，已经超过 44° 机械极限 → 前轮顶死在满舵。
      # 降到 0.6 后只需 35°，留出余量。
      max_vel_x: 0.23
      min_vel_x: -0.10                  # 留一点倒车能力（避障恢复要用）
      # 2026-09-17：0.6 → 0.45。转向幅度再收一档，配合适配节点的
      # 转速率限制和死区，让"左右打方向"进一步减少。
      max_vel_theta: 0.45
      min_vel_theta: -0.45
      acc_lim_x: 0.7                    # 实测最大加速度约 0.7 m/s^2
      acc_lim_theta: 0.6                # 原来 3.2，等于完全不限转向加速度

      # ---- 轨迹与障碍 ----
      min_obstacle_dist: 0.15
      inflation_dist: 0.25
      weight_obstacle: 50.0
      weight_optimaltime: 1.0
      max_global_plan_lookahead_dist: 1.5

      # ---- 拓扑规划 ----
      # 开着它会同时优化"绕障碍从左还是从右"多条轨迹，算力大，
      # 而且在阿克曼车上容易选来选去（表现为方向犹豫）。关掉。
      enable_homotopy_class_planning: false
      enable_multithreading: true
      optimization_verbose: false
      teb_autoresize: true
      min_samples: 3
      max_samples: 20
      visualize_hc_graph: false

      costmap_converter_plugin: costmap_converter::CostmapToPolygonsDBSMCCH
      costmap_converter_spin_thread: true
      costmap_converter_rate: 20
costmap_converter:
  ros__parameters:
    use_sim_time: false
controller_server_rclcpp_node:
  ros__parameters:
