# ============================================================
# 2026-09-15 新增：velocity_smoother 配置
#
# 为什么必须加这一段：
#   这台车的**转向走 linear.y**（不是标准的 angular.z）。
#   Nav2 velocity_smoother 的默认值是：
#       max_velocity: [0.5, 0.0, 2.5]
#       min_velocity: [-0.5, 0.0, -2.5]
#                       x    y   theta
#   第二项（y）是 0 —— 而 scale_velocities 默认 false 表示"夹断"而非缩放。
#
#   实测验证（scripts/test_smoother.sh）：
#       往 /cmd_vel_nav 发 linear.y = 0.02（20° 转向）
#       平滑后 /cmd_vel 收到 127 条，**全是 0.0**
#   → 转向指令被整个吃掉，控制器发出的转向永远到不了底盘。
#
#   后果：车不按规划路径走，TEB 以为发了转向却没生效，于是不停修正，
#         表现为前轮"一直在修方向"（F1 暖胎）。
#
# 修法：把 y 分量的上下限放开，覆盖实际转向范围
#   （linear.y = 转角(deg)/1000，±0.05 = ±50°，略大于最大 45°）
# ============================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    #         x      y(转向)  theta(R2 不用)
    max_velocity: [0.30,  0.05,  0.0]
    min_velocity: [-0.30, -0.05, 0.0]
    deadband_velocity: [0.0, 0.0, 0.0]
    odom_topic: odom
    odom_duration: 0.1
    velocity_timeout: 1.0


# ======================================================================
# 转向适配节点 cmd_vel_ackermann  —— 2026-09-18 从 launch 挪到这里
#
# 为什么要挪：以前这些限幅写在 navigation_r2.launch.py 的启动参数里，
# 而 Nav2/AMCL 的参数在 nav_r2.yaml，改一个限幅要翻两个文件。
# 现在统一：**所有转向相关的限幅都在这一段改**。
#
# 背景（2026-09-16 实测）：这台车底盘把 angular.z=0 当成"不更新转向"，
# 所以 Nav2 说"直行"时前轮会保持上次角度、车在画弧。本节点改成自己按
# 阿克曼模型算转向角，走 linear.y（值×1000=度）这条直接通道。
# ======================================================================
cmd_vel_ackermann:
  ros__parameters:
    # 车体几何：实测轴距
    wheelbase: 0.2681

    # 转向角限幅（度）。机械极限是 44°，留 4° 余量。
    max_steer_deg: 40.0
    # 倒车时用更严的限幅：δ=atan(ω·L/|v|)，倒车时 |v| 很小会被放大，
    # 实测倒车时转向打到 17~35°，是定位崩溃的常见触发点。
    reverse_steer_deg: 22.0

    # 舵机转速率上限（度/秒）。调小 = 前轮动得更柔和（治"左右打方向"）；
    # 调大 = 响应快但会抖。原来 70，现在 45。
    max_steer_rate_dps: 45.0
    # 转向死区（度）：目标变化小于它就不动，抹掉控制器的微抖动。
    steer_deadband_deg: 1.5

    # 低于这个车速时不按 atan(ωL/v) 算转向（会除小量爆掉），改为保持
    min_speed: 0.05
    # 转向角接近 0 时强制发 ±这个值（固件把 0 当"不更新"）
    eps_deg: 1.0
    # 直行微调：标定后填（正数往左）。历史实测值 -2.9，但那是另一套口径，
    # 先在实车上验证再填，别直接抄。
    steer_trim_deg: 0.0

    # 话题
    input_topic: /cmd_vel_nav      # Nav2 的输出
    output_topic: /cmd_vel         # 底盘驱动听的那个
    halt_topic: /cmd_vel_halt      # 定位护卫节点用它叫停
    cmd_timeout: 0.5               # 多久没指令就停车
    publish_rate: 20.0
    log_every: 0                   # >0 时每 N 条指令打一行日志（排查用）
