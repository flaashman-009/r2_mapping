# AMCL 定位参数（Yahboom R2）
#
# 本文件用于定位复测，不参与建图。
# 参数基线来自历史调参结论（2026-08-29 AMCL 漂移问题的补丁）。

amcl:
  ros__parameters:
    use_sim_time: false

    # ---- 坐标系 ----
    global_frame_id: map
    odom_frame_id: odom
    # 与 slam_toolbox 的 base_frame 保持一致
    base_frame_id: base_footprint
    tf_broadcast: true

    # ---- 运动模型 ----
    # 阿克曼底盘在 AMCL 里仍用（近似的）差速模型即可：
    # 低速下阿克曼与差速的运动学差异对粒子传播影响很小，
    # 真正会害死定位的是里程计标尺和外参。
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # ---- 粒子数 ----
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # ---- 观测模型 ----
    laser_model_type: likelihood_field
    laser_max_range: 12.0
    laser_min_range: 0.12
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    lambda_short: 0.1

    # ---- 波束跳过（动态障碍多时可开）----
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    # ---- 更新触发 ----
    # 走 5 cm 或转 0.05 rad 才更新一次：阿克曼低速下足够灵敏又不抖
    update_min_d: 0.05
    update_min_a: 0.05
    transform_tolerance: 0.25

    # ---- 恢复机制 ----
    # 定位真的丢了（被人抬走）时才需要，平时保持温和
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

    # ---- 初始位姿 ----
    # 必须为 false：交给 scripts/set_initial_pose.sh 或 RViz 的 2D Pose Estimate。
    # 若为 true，每次启动都会用 initial_pose 覆盖实际设置，导致定位直接错位。
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    save_pose_rate: 0.5

    # ---- 输入 ----
    # launch 里会 remap 到实际话题（默认 scan）
    scan_topic: scan

